# Maven Wrapper - descarga Maven automaticamente si no esta instalado.
# Asi cualquiera que clone el repo puede compilar y ejecutar con ./mvnw
# (Linux/Mac) o mvnw.cmd (Windows) SIN instalar Maven manualmente.
wrapperVersion=3.3.2
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.zip
